services:
  - type: web
    name: ai-pr-reviewer-application
    runtime: python
    region: frankfurt
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.13
      - key: ALLOWED_GITHUB_REPOSITORIES
        value: Khumo-Hub/AI-PR-Reviewer-application
      - key: MAX_PR_DIFF_BYTES
        value: "500000"
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: MICROSOFT_AUTHORITY
        value: https://login.microsoftonline.com/common
      - key: MICROSOFT_TOKEN_CACHE_PATH
        value: .data/msal_token_cache.json
      - key: OPENAI_API_KEY
        sync: false
      - key: REVIEW_API_KEY
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_REDIRECT_URI
        sync: false
      - key: OUTLOOK_REVIEW_RECIPIENT
        sync: false
      # Optional. Set this to a path on a persistent disk in production,
      # for example /var/data/review_state.json.
      - key: REVIEW_STATE_PATH
        sync: false
